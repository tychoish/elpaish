name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "30.2"
          - "31.1"
    steps:
      - uses: actions/checkout@v5

      - name: Ensure texinfo tools are installed
        run: which makeinfo >/dev/null 2>&1 && which install-info >/dev/null 2>&1 || (apt-get update && apt-get install -y texinfo install-info)

      - name: Run ERT Self-Tests
        uses: tychoish/elisp-ci@main
        env:
          ELPAISH_SIGNING_KEY: "__testing_value"
          ELPAISH_GPG_PASSPHRASE: ""
        with:
          load-paths: |
            pkg
            scripts
            test
          test-files: "test/test-elpaish.el"
          dependencies: |
            compat
            package-build
            htmlize
            web-server
            transient
            annotated-completing-read
          cache: "true"
