name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "30.2"
          - "31.1"
    steps:
      - uses: actions/checkout@v5

      - name: Ensure Texinfo Tools
        uses: tychoish/elisp-ci/texinfo@main

      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@main
        with:
          elpaish: "true"
          load-paths: |
            pkg
            scripts
          target-files: |
            pkg/elpaish.el
            pkg/elpaish-async.el
            pkg/elpaish-check.el
            pkg/elpaish-css.el
            pkg/elpaish-install.el
            pkg/elpaish-keyring.el
            pkg/elpaish-ops.el
            pkg/elpaish-recipes.el
            pkg/elpaish-signing-keys.el
            pkg/elpaish-website.el
          package-lint-main-file: "pkg/elpaish.el"
          linters: "byte-compile checkdoc package-lint"
          required-linters: "byte-compile checkdoc package-lint"

      - name: Run ERT Self-Tests
        uses: tychoish/elisp-ci@main
        env:
          ELPAISH_SIGNING_KEY: "__testing_value"
          ELPAISH_GPG_PASSPHRASE: ""
        with:
          elpaish: "true"
          load-paths: |
            pkg
            scripts
            test
          test-files: "test/test-elpaish.el test/test-elpaish-ops.el"
          dependencies: |
            compat
            package-build
            htmlize
            web-server
            transient
            annotated-completing-read
            modus-themes
            gen
            logx
          cache: "true"
          cache-key: "20261118"
