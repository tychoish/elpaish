name: Deploy ELPAish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild development snapshots and staging tracks every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: silex/emacs:30.2-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build ELPAish Repository & Artifact
        uses: ./
        with:
          packages-file: packages.el
          output-dir: public/
          signing-key: ${{ secrets.ELPAISH_SIGNING_KEY }}
          gpg-passphrase: ${{ secrets.ELPAISH_GPG_PASSPHRASE }}
          upload-pages-artifact: "true"

      - name: Run Fast Local Consumer Integration Tests
        run: |
          emacs --batch -L pkg -L scripts -L test \
            -l test/test-elpaish-integration.el \
            --eval '(ert-run-tests-batch-and-exit "elpaish-integration-test-local-preview-server")'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    name: Verify Deployment & Run Consumer Integration Tests
    runs-on: ubuntu-latest
    container: silex/emacs:30.2-ci
    needs: deploy
    steps:
      - uses: actions/checkout@v5

      - name: Cache Emacs Dependencies
        uses: tychoish/elisp-ci/cache@main
        with:
          cache-dir: elpa-ci

      - name: Bootstrap ELPAish Dependencies
        run: emacs --batch -l scripts/bootstrap-elpaish.el

      - name: Run Consumer Subprocess Integration Tests
        env:
          ELPAISH_RUN_INTEGRATION_TESTS: "1"
          ELPAISH_ARCHIVE_URL: ${{ needs.deploy.outputs.page_url }}snapshot/
        run: |
          emacs --batch -L pkg -L scripts -L test \
            -l test/test-elpaish-integration.el \
            --eval '(ert-run-tests-batch-and-exit "^elpaish-integration-test-.*")'
