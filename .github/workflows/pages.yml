name: Deploy ELPAish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild development snapshots and staging tracks every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: silex/emacs:30.2-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: emacs --batch -l scripts/bootstrap-elpaish.el
      - env:
          ELPAISH_SIGNING_KEY: ${{ secrets.ELPAISH_SIGNING_KEY }}
          ELPAISH_GPG_PASSPHRASE: ${{ secrets.ELPAISH_GPG_PASSPHRASE }}
          ELPAISH_OUTPUT_DIR: public/
        run: emacs --batch -L pkg -L scripts -l scripts/build-elpaish.el
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    name: Verify Deployment & Run Consumer Integration Tests
    runs-on: ubuntu-latest
    container: silex/emacs:30.2-ci
    needs: deploy
    steps:
      - uses: actions/checkout@v5
      - run: emacs --batch -l scripts/bootstrap-elpaish.el
      - name: Run Consumer Subprocess Integration Tests
        env:
          ELPAISH_RUN_INTEGRATION_TESTS: "1"
          ELPAISH_ARCHIVE_URL: ${{ needs.deploy.outputs.page_url }}snapshot/
        run: |
          emacs --batch -L pkg -L scripts -L test \
            -l test/test-elpaish-integration.el \
            --eval '(ert-run-tests-batch-and-exit "^elpaish-integration-test-.*")'
