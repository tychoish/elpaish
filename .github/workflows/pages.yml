name: Deploy ELPAish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild development snapshots and staging tracks every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: silex/emacs:30.2-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build ELPAish Repository
        uses: tychoish/elisp-ci/elpaish@main
        with:
          packages-file: packages.el
          output-dir: public/
          signing-key: ${{ secrets.ELPAISH_SIGNING_KEY }}
          gpg-passphrase: ${{ secrets.ELPAISH_GPG_PASSPHRASE }}
          upload-pages-artifact: false

      - name: Run Fast Local Consumer Integration Tests
        uses: tychoish/elisp-ci@main
        env:
          ELPAISH_RUN_INTEGRATION_TESTS: all
        with:
          test-files: test/test-elpaish-integration.el
          load-paths: |
            pkg
            scripts
            test
          dependencies: |
            compat
            package-build
            htmlize
            web-server
            transient
            annotated-completing-read
            modus-themes
          cache: "true"
          cache-dir: elpa-ci

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    name: Verify Deployment (${{ matrix.stream }}, Emacs ${{ matrix.emacs-version }})
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.4"
          - "30.2"
          - "31.1"
        stream:
          - staging
          - stable
          - snapshot
    steps:
      - uses: actions/checkout@v5

      - name: Run Consumer Subprocess Integration Tests
        uses: tychoish/elisp-ci@main
        env:
          ELPAISH_RUN_INTEGRATION_TESTS: all
          ELPAISH_ARCHIVE_URL: ${{ needs.deploy.outputs.page_url }}${{ matrix.stream }}/
        with:
          test-files: test/test-elpaish-integration.el
          load-paths: |
            pkg
            scripts
            test
          dependencies: |
            compat
            package-build
            htmlize
            web-server
            transient
            annotated-completing-read
            modus-themes
          cache: "true"
          cache-dir: elpa-ci
