name: Deploy ELPAish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild development snapshots and staging tracks every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: silex/emacs:30.2-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build ELPAish Repository & Artifact
        uses: ./
        with:
          packages-file: packages.el
          output-dir: public/
          signing-key: ${{ secrets.ELPAISH_SIGNING_KEY }}
          gpg-passphrase: ${{ secrets.ELPAISH_GPG_PASSPHRASE }}
          upload-pages-artifact: "true"

      - name: Run Fast Local Consumer Integration Tests
        run: |
          emacs --batch -L pkg -L scripts -L test \
            -l test/test-elpaish-integration.el \
            --eval '(ert-run-tests-batch-and-exit "elpaish-integration-test-local-preview-server")'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    name: Verify Deployment HTTP Smoke Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Smoke Check Live Archive
        run: |
          curl -fsSL "${{ needs.deploy.outputs.page_url }}snapshot/archive-contents" -o /dev/null
          curl -fsSL "${{ needs.deploy.outputs.page_url }}elpaish-keyring.gpg" -o /dev/null
