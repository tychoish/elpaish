name: "ELPAish Package Repository Builder"
description: "Build, sign, and publish arbitrary Emacs package repositories with caching."
author: "tychoish"

inputs:
  packages-file:
    description: "Path to packages definition file (relative to workspace or absolute)."
    required: false
    default: "packages.el"
  output-dir:
    description: "Directory where the ELPA archive and static website will be written (ephemeral, never cached)."
    required: false
    default: "public/"
  work-dir:
    description: "Directory where remote Git repositories are cloned."
    required: false
    default: "repos/"
  parallel-jobs:
    description: "Maximum concurrent package build jobs (number or 'auto')."
    required: false
    default: "auto"
  streams:
    description: "Space-separated list of streams to generate (e.g. 'all', or 'snapshot stable staging')."
    required: false
    default: "all"
  signing-key:
    description: "GPG private key content for archive signing (optional)."
    required: false
    default: ""
  gpg-passphrase:
    description: "GPG passphrase for archive signing (optional)."
    required: false
    default: ""
  cache:
    description: "Enable dependency caching with weekly epochs (true/false)."
    required: false
    default: "true"
  cache-dir:
    description: "Directory for caching installed ELPA dependencies."
    required: false
    default: "elpa-ci"
  cache-repos:
    description: "Enable caching of cloned upstream Git repositories (true/false)."
    required: false
    default: "true"
  preflight:
    description: "Run preflight lint/compile quality checks before publishing (0 or 1)."
    required: false
    default: "0"
  upload-pages-artifact:
    description: "Automatically upload output-dir as a GitHub Pages artifact (true/false)."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Ensure texinfo tools are installed
      shell: bash
      run: |
        which makeinfo >/dev/null 2>&1 && which install-info >/dev/null 2>&1 || (apt-get update && apt-get install -y texinfo install-info)

    # Cache Invariant: Only immutable external ELPA dependencies and upstream
    # Git repositories are preserved across runs. Built package tarballs,
    # signatures, archive catalogs, and website HTML (public/) MUST NEVER be
    # cached to ensure build purity and reproducibility.
    - name: Cache Emacs Dependencies
      if: inputs.cache == 'true'
      uses: tychoish/elisp-ci/cache@main
      with:
        cache-dir: ${{ inputs.cache-dir }}

    - name: Cache Cloned Git Repositories
      if: inputs.cache == 'true' && inputs.cache-repos == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.work-dir }}
        key: elpaish-repos-${{ runner.os }}-${{ hashFiles(inputs.packages-file) }}
        restore-keys: |
          elpaish-repos-${{ runner.os }}-

    - name: Bootstrap Package Dependencies
      shell: bash
      env:
        ELPAISH_ACTION_PATH: ${{ github.action_path }}
        ELPAISH_PACKAGES_FILE: ${{ inputs.packages-file }}
      run: |
        emacs --batch --eval '
          (let* ((raw (getenv "ELPAISH_ACTION_PATH"))
                 (resolve (lambda (p)
                            (cond
                             ((or (null p) (string-empty-p p)) nil)
                             ((file-directory-p p) (expand-file-name p))
                             ((and (string-prefix-p "/home/runner/work/" p)
                                   (file-directory-p (concat "/__w/" (substring p 18))))
                              (expand-file-name (concat "/__w/" (substring p 18))))
                             ((and (getenv "GITHUB_ACTION_PATH")
                                   (file-directory-p (getenv "GITHUB_ACTION_PATH")))
                              (expand-file-name (getenv "GITHUB_ACTION_PATH")))
                             (t default-directory))))
                 (root (funcall resolve raw)))
            (setenv "ELPAISH_ROOT" root)
            (load (expand-file-name "scripts/bootstrap-elpaish.el" root) nil nil t))'

    - name: Build ELPA Package Repository
      shell: bash
      env:
        ELPAISH_ACTION_PATH: ${{ github.action_path }}
        ELPAISH_PACKAGES_FILE: ${{ inputs.packages-file }}
        ELPAISH_OUTPUT_DIR: ${{ inputs.output-dir }}
        ELPAISH_WORK_DIR: ${{ inputs.work-dir }}
        ELPAISH_PARALLEL_JOBS: ${{ inputs.parallel-jobs }}
        ELPAISH_STREAMS: ${{ inputs.streams }}
        ELPAISH_SIGNING_KEY: ${{ inputs.signing-key }}
        ELPAISH_GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
        ELPAISH_RUN_PREFLIGHT: ${{ inputs.preflight }}
      run: |
        emacs --batch --eval '
          (let* ((raw (getenv "ELPAISH_ACTION_PATH"))
                 (resolve (lambda (p)
                            (cond
                             ((or (null p) (string-empty-p p)) nil)
                             ((file-directory-p p) (expand-file-name p))
                             ((and (string-prefix-p "/home/runner/work/" p)
                                   (file-directory-p (concat "/__w/" (substring p 18))))
                              (expand-file-name (concat "/__w/" (substring p 18))))
                             ((and (getenv "GITHUB_ACTION_PATH")
                                   (file-directory-p (getenv "GITHUB_ACTION_PATH")))
                              (expand-file-name (getenv "GITHUB_ACTION_PATH")))
                             (t default-directory))))
                 (root (funcall resolve raw)))
            (setenv "ELPAISH_ROOT" root)
            (load (expand-file-name "scripts/build-elpaish.el" root) nil nil t))'

    - name: Upload Pages Artifact
      if: inputs.upload-pages-artifact == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.output-dir }}
